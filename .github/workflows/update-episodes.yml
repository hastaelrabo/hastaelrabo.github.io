name: Actualizar episodios del podcast

on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Actualizar episodes.json desde el RSS
        run: python3 fetch_rss.py

      - name: Guardar cambios si hay episodios nuevos
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add episodes.json
          if git diff --cached --quiet; then
            echo 'No hay cambios.'
          else
            git commit -m 'Actualizar episodios desde RSS'
            git push
          fi
