<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Todos los episodios - Hasta el Rabo Todo es Toro</title>

<style>

body {
  margin: 0;
  background: #ffffff;
  color: #222222;
  font-family: Arial, sans-serif;
}

/* CABECERA */

header {
  padding: 35px 20px;
  background: #f5eee5;
  text-align: center;
}

header h1 {
  margin: 0 0 15px;
  font-size: 34px;
}

header a {
  display: inline-block;
  padding: 10px 18px;
  background: #5b2a86;
  color: #ffffff;
  text-decoration: none;
  border-radius: 25px;
  font-weight: bold;
}

/* LISTA */

#episodes {
  max-width: 1000px;
  margin: 0 auto;
  padding: 30px 20px 60px;
}

/* EPISODIO */

.episode {
  display: flex;
  align-items: flex-start;
  gap: 15px;
  padding: 16px 0;
  border-bottom: 1px solid #dddddd;
}

.cover {
  width: 80px;
  height: 80px;
  flex: 0 0 80px;
}

.cover img {
  width: 80px;
  height: 80px;
  object-fit: cover;
  border-radius: 8px;
}

.info {
  flex: 1;
  min-width: 0;
}

.number {
  color: #5b2a86;
  font-size: 12px;
  font-weight: bold;
  margin-bottom: 4px;
}

.title {
  font-size: 15px;
  font-weight: bold;
  line-height: 1.35;
}

.date {
  margin-top: 5px;
  color: #888888;
  font-size: 11px;
}

/* REPRODUCTOR */

.player {
  width: 100%;
  margin-top: 12px;
}

.player audio {
  display: block;
  width: 100%;
  min-width: 220px;
  height: 45px;
}

/* CARGANDO */

.loading {
  padding: 50px 20px;
  text-align: center;
  color: #777777;
}

/* ERROR */

.error {
  margin: 30px 0;
  padding: 20px;
  background: #f8dddd;
  color: #8a2222;
  border-radius: 8px;
  line-height: 1.5;
}

/* MÓVIL */

@media (max-width: 600px) {

  header h1 {
    font-size: 29px;
  }

  #episodes {
    padding: 20px 12px 50px;
  }

  .episode {
    gap: 10px;
    padding: 13px 0;
  }

  .cover,
  .cover img {
    width: 65px;
    height: 65px;
    flex-basis: 65px;
  }

  .title {
    font-size: 13px;
  }

  .player audio {
    width: 100%;
    min-width: 0;
    height: 42px;
  }

}

</style>
</head>
