<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Todos los episodios - Hasta el Rabo Todo es Toro</title>

  <style>

    body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #222222;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 35px 20px;
      background: #f5eee5;
      text-align: center;
    }

    header h1 {
      margin: 0 0 15px;
      font-size: 36px;
    }

    header a {
      display: inline-block;
      padding: 10px 18px;
      background: #5b2a86;
      color: white;
      text-decoration: none;
      border-radius: 25px;
      font-weight: bold;
    }

    #episodes {
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 20px 60px;
    }

    .episode {
      display: flex;
      align-items: center;
      gap: 15px;
      padding: 12px 0;
      border-bottom: 1px solid #dddddd;
    }

    .episode img {
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
      flex-shrink: 0;
    }

    .episode-text {
      flex: 1;
      min-width: 0;
    }

    .episode-number {
      display: block;
      margin-bottom: 4px;
      color: #5b2a86;
      font-size: 12px;
      font-weight: bold;
    }

    .episode-title {
      font-size: 15px;
      font-weight: bold;
      line-height: 1.35;
    }

    .episode-date {
      margin-top: 5px;
      color: #888888;
      font-size: 11px;
    }

    .play {
      width: 42px;
      height: 42px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #5b2a86;
      color: white;
      font-size: 17px;
      cursor: pointer;
      flex-shrink: 0;
    }

    .play:hover {
      opacity: 0.85;
    }

    .loading {
      padding: 50px;
      text-align: center;
      color: #777777;
    }

    .error {
      padding: 25px;
      background: #f8dddd;
      color: #8a2222;
      border-radius: 8px;
    }

    audio {
      display: none;
    }

    @media (max-width: 600px) {

      header h1 {
        font-size: 30px;
      }

      .episode img {
        width: 65px;
        height: 65px;
      }

      .episode-title {
        font-size: 13px;
      }

      .play {
        width: 38px;
        height: 38px;
      }

    }

  </style>

</head>


<body>


<header>

  <h1>
    Todos los episodios
  </h1>

  <a href="index.html#episodios">
    ← Volver a los últimos episodios
  </a>

</header>


<div id="episodes">

  <div class="loading">
    Cargando episodios...
  </div>

</div>


<script>

  const episodesContainer =
    document.getElementById('episodes');


  fetch('./episodes.json?v=' + Date.now())


    .then(function(response) {

      if (!response.ok) {

        throw new Error(
          'No se pudo cargar episodes.json'
        );

      }

      return response.json();

    })


    .then(function(data) {

      console.log(
        'episodes.json cargado:',
        data
      );


      if (
        !data ||
        !Array.isArray(data.episodes)
      ) {

        throw new Error(
          'episodes.json no contiene una lista de episodios'
        );

      }


      let html = '';


      data.episodes.forEach(
        function(ep, index) {

          let title =
            ep.title || 'Episodio';


          /*
             Quitamos T4 E30 del principio
             para que el título sea más limpio.
          */

          title =
            title.replace(
              /^\s*T\s*\d+\s*E\s*\d+\s*/i,
              ''
            );


          /*
             Primeros 50 caracteres.
          */

          if (title.length > 50) {

            title =
              title.substring(0, 50)
              .trim() + '…';

          }


          const seasonMatch =
            String(ep.title || '')
            .match(/T\s*(\d+)/i);


          const episodeMatch =
            String(ep.title || '')
            .match(/E\s*(\d+)/i);


          const season =
            seasonMatch
              ? seasonMatch[1]
              : '';


          const episodeNumber =
            episodeMatch
              ? episodeMatch[1]
              : '';


          let date = '';


          if (ep.date) {

            const d =
              new Date(ep.date);


            if (!isNaN(d.getTime())) {

              date =
                d.toLocaleDateString(
                  'es-ES',
                  {
                    day: 'numeric',
                    month: 'long',
                    year: 'numeric'
                  }
                );

            }

          }


          let imageHtml = '';


          if (ep.image) {

            imageHtml = `
              <img
                src="${ep.image}"
                alt=""
                loading="lazy"
              >
            `;

          } else {

            imageHtml = `
              <div
                style="
                  width:80px;
                  height:80px;
                  background:#eeeeee;
                  display:flex;
                  align-items:center;
                  justify-content:center;
                  font-weight:bold;
                  color:#5b2a86;
                "
              >
                HRT
              </div>
            `;

          }


          html += `

            <div class="episode">

              ${imageHtml}


              <div class="episode-text">

                <span class="episode-number">

                  T${season}
                  ${episodeNumber
                    ? ' E' + episodeNumber
                    : ''
                  }

                </span>


                <div class="episode-title">

                  ${title}

                </div>


                <div class="episode-date">

                  ${date}

                </div>

              </div>


              ${
                ep.audio
                  ? `

                    <audio
                      id="audio-${index}"
                      src="${ep.audio}"
                      preload="none"
                    ></audio>


                    <button
                      class="play"
                      type="button"
                      data-audio="audio-${index}"
                      aria-label="Reproducir ${ep.title}"
                    >
                      ▶
                    </button>

                  `
                  : ''
              }

            </div>

          `;

        }
      );


      episodesContainer.innerHTML =
        html;


      /*
         Botones de reproducción.
      */

      const buttons =
        document.querySelectorAll(
          '.play'
        );


      buttons.forEach(
        function(button) {

          button.addEventListener(
            'click',
            function() {

              const audio =
                document.getElementById(
                  button.dataset.audio
                );


              if (!audio) {
                return;
              }


              /*
                 Paramos cualquier otro
                 episodio que esté sonando.
              */

              document
                .querySelectorAll('audio')
                .forEach(
                  function(other) {

                    if (
                      other !== audio
                    ) {

                      other.pause();

                      other.currentTime = 0;

                    }

                  }
                );


              if (audio.paused) {

                audio.play();

                button.textContent =
                  'Ⅱ';

              } else {

                audio.pause();

                button.textContent =
                  '▶';

              }


              audio.onended =
                function() {

                  button.textContent =
                    '▶';

                };

            }
          );

        }
      );

    })


    .catch(function(error) {

      console.error(
        'ERROR:',
        error
      );


      episodesContainer.innerHTML = `

        <div class="error">

          <strong>
            Error cargando los episodios.
          </strong>

          <br><br>

          ${error.message}

        </div>

      `;

    });

</script>


</body>

</html>
