<!doctype html>
<html lang="es">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Todos los episodios | Hasta el Rabo Todo es Toro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #222;
      background: #fff;
    }

    .archive-header {
      padding: 40px 20px 30px;
      background: #f7f1e8;
      border-bottom: 1px solid #ddd;
    }

    .archive-header-inner {
      max-width: 1000px;
      margin: 0 auto;
    }

    .archive-kicker {
      margin: 0 0 8px;
      color: #5b2a86;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.08em;
    }

    .archive-header h1 {
      margin: 0;
      font-size: 42px;
      line-height: 1.05;
    }

    .back-link {
      display: inline-block;
      margin-top: 20px;
      padding: 9px 15px;
      border-radius: 30px;
      background: #5b2a86;
      color: white;
      text-decoration: none;
      font-size: 13px;
      font-weight: 700;
    }

    .archive-main {
      max-width: 1000px;
      margin: 0 auto;
      padding: 35px 20px 70px;
    }

    .season {
      margin-bottom: 42px;
    }

    .season-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
      margin: 0 0 10px;
      padding-bottom: 10px;
      border-bottom: 2px solid #5b2a86;
    }

    .season-title h2 {
      margin: 0;
      font-size: 22px;
    }

    .season-count {
      color: #888;
      font-size: 12px;
    }

    .episode-list {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .episode {
      position: relative;
      display: grid;
      grid-template-columns: 65px minmax(0, 1fr);
      gap: 10px;
      align-items: center;
      min-height: 90px;
      padding: 10px;
      border: 1px solid #e4e4e4;
      border-radius: 9px;
      background: white;
    }

    .episode-image {
      width: 65px;
      height: 65px;
      overflow: hidden;
      border-radius: 7px;
      background: #eee;
    }

    .episode-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .episode-placeholder {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      height: 100%;
      color: #5b2a86;
      font-size: 11px;
      font-weight: 800;
    }

    .episode-info {
      min-width: 0;
    }

    .episode-number {
      display: block;
      margin-bottom: 3px;
      color: #5b2a86;
      font-size: 11px;
      font-weight: 800;
    }

    .episode-name {
      display: block;
      overflow: hidden;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
    }

    .episode-date {
      margin-top: 5px;
      color: #999;
      font-size: 10px;
    }

    .play-button {
      position: absolute;
      right: 9px;
      bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 30px;
      height: 30px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #5b2a86;
      color: white;
      cursor: pointer;
      font-size: 12px;
      line-height: 1;
    }

    .play-button:hover {
      transform: scale(1.05);
    }

    .play-button:focus-visible {
      outline: 3px solid rgba(91, 42, 134, 0.3);
      outline-offset: 2px;
    }

    .loading {
      padding: 50px 20px;
      text-align: center;
      color: #777;
    }

    .error {
      padding: 30px;
      border-radius: 10px;
      background: #f8eeee;
      color: #8a3333;
    }

    @media (max-width: 800px) {
      .episode-list {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 520px) {
      .archive-header h1 {
        font-size: 32px;
      }

      .episode-list {
        grid-template-columns: 1fr;
      }

      .episode {
        min-height: 82px;
      }
    }
  </style>

</head>


<body>

  <header class="archive-header">

    <div class="archive-header-inner">

      <p class="archive-kicker">
        ARCHIVO DEL PROGRAMA
      </p>

      <h1>
        Todos los episodios
      </h1>

      <a
        class="back-link"
        href="index.html#episodios"
      >
        ← VOLVER A LOS ÚLTIMOS 5
      </a>

    </div>

  </header>


  <main class="archive-main">

    <div id="episodes">

      <div class="loading">
        Cargando episodios…
      </div>

    </div>

  </main>


  <script>

    const container =
      document.getElementById('episodes');

    let currentAudio = null;
    let currentButton = null;


    function escapeHtml(value) {

      return String(value || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#039;');

    }


    function getSeason(title) {

      const match =
        String(title || '').match(/T\s*(\d+)/i);

      return match
        ? parseInt(match[1], 10)
        : 0;

    }


    function getEpisodeNumber(title) {

      const match =
        String(title || '').match(/E\s*(\d+)/i);

      return match
        ? parseInt(match[1], 10)
        : 0;

    }


    function getTitle(title) {

      let result =
        String(title || 'Episodio');

      result =
        result.replace(
          /^\s*T\s*\d+\s*E\s*\d+\s*/i,
          ''
        );

      result =
        result.replace(
          /^\s*[-–—:]\s*/,
          ''
        );

      return result.trim();

    }


    function shortTitle(title) {

      const clean =
        getTitle(title);

      if (clean.length <= 50) {
        return clean;
      }

      return clean
        .substring(0, 50)
        .trimEnd() + '…';

    }


    function formatDate(value) {

      if (!value) {
        return '';
      }

      const date =
        new Date(value);

      if (isNaN(date.getTime())) {
        return '';
      }

      return new Intl.DateTimeFormat(
        'es-ES',
        {
          day: 'numeric',
          month: 'long',
          year: 'numeric'
        }
      ).format(date);

    }


    function createEpisode(ep) {

      const season =
        getSeason(ep.title);

      const number =
        getEpisodeNumber(ep.title);

      const label =
        season
          ? `T${season} E${number}`
          : 'EPISODIO';


      const image =
        ep.image
          ? `
            <img
              src="${escapeHtml(ep.image)}"
              alt=""
              loading="lazy"
            >
          `
          : `
            <div class="episode-placeholder">
              HRT
            </div>
          `;


      const audioId =
        'audio-' +
        Math.random()
          .toString(36)
          .substring(2);


      return `

        <article class="episode">

          <div class="episode-image">
            ${image}
          </div>


          <div class="episode-info">

            <span class="episode-number">
              ${escapeHtml(label)}
            </span>

            <span class="episode-name">
              ${escapeHtml(
                shortTitle(ep.title)
              )}
            </span>

            <div class="episode-date">
              ${escapeHtml(
                formatDate(ep.date)
              )}
            </div>

          </div>


          ${
            ep.audio
              ? `

                <audio
                  id="${audioId}"
                  preload="none"
                  src="${escapeHtml(ep.audio)}"
                ></audio>

                <button
                  class="play-button"
                  type="button"
                  data-audio="${audioId}"
                  aria-label="Reproducir ${escapeHtml(ep.title)}"
                  title="Reproducir"
                >
                  ▶
                </button>

              `
              : ''
          }

        </article>

      `;

    }


    function renderEpisodes(episodes) {

      if (
        !Array.isArray(episodes) ||
        episodes.length === 0
      ) {

        container.innerHTML = `
          <div class="error">
            No se han encontrado episodios.
          </div>
        `;

        return;

      }


      const seasons = {};


      episodes.forEach(ep => {

        const season =
          getSeason(ep.title) || 0;

        if (!seasons[season]) {
          seasons[season] = [];
        }

        seasons[season].push(ep);

      });


      const seasonNumbers =
        Object.keys(seasons)
          .map(Number)
          .sort((a, b) => b - a);


      let html = '';


      seasonNumbers.forEach(
        seasonNumber => {

          const list =
            seasons[seasonNumber];


          list.sort((a, b) => {

            const episodeA =
              getEpisodeNumber(a.title);

            const episodeB =
              getEpisodeNumber(b.title);


            if (
              episodeA !== episodeB
            ) {

              return episodeB - episodeA;

            }


            return new Date(
              b.date || 0
            ) -
            new Date(
              a.date || 0
            );

          });


          const seasonName =
            seasonNumber
              ? `Temporada ${seasonNumber}`
              : 'Otros episodios';


          html += `

            <section class="season">

              <div class="season-title">

                <h2>
                  ${escapeHtml(seasonName)}
                </h2>

                <span class="season-count">
                  ${list.length} episodios
                </span>

              </div>


              <div class="episode-list">

                ${list
                  .map(createEpisode)
                  .join('')
                }

              </div>

            </section>

          `;

        }
      );


      container.innerHTML = html;


      document
        .querySelectorAll('.play-button')
        .forEach(button => {

          button.addEventListener(
            'click',
            function () {

              const audioId =
                this.dataset.audio;

              const audio =
                document.getElementById(
                  audioId
                );


              if (!audio) {
                return;
              }


              if (
                currentAudio &&
                currentAudio !== audio
              ) {

                currentAudio.pause();

                if (currentButton) {
                  currentButton.textContent =
                    '▶';
                }

              }


              if (audio.paused) {

                audio.play()
                  .then(() => {

                    currentAudio =
                      audio;

                    currentButton =
                      this;

                    this.textContent =
                      'Ⅱ';

                  })
                  .catch(error => {

                    console.error(
                      'Error reproduciendo:',
                      error
                    );

                  });

              } else {

                audio.pause();

                this.textContent =
                  '▶';

                currentAudio =
                  null;

                currentButton =
                  null;

              }

            }
          );

        });


      document
        .querySelectorAll('audio')
        .forEach(audio => {

          audio.addEventListener(
            'ended',
            function () {

              const button =
                document.querySelector(
                  `[data-audio="${this.id}"]`
                );

              if (button) {
                button.textContent =
                  '▶';
              }

            }
          );

        });

    }


    fetch(
      'episodes.json?v=' +
      Date.now()
    )

      .then(response => {

        if (!response.ok) {

          throw new Error(
            'No se pudo cargar episodes.json'
          );

        }

        return response.json();

      })

      .then(data => {

        renderEpisodes(
          data.episodes
        );

      })

      .catch(error => {

        console.error(error);

        container.innerHTML = `

          <div class="error">

            <strong>
              No se han podido cargar
              los episodios.
            </strong>

            <br><br>

            Comprueba que el archivo
            <strong>episodes.json</strong>
            está publicado en GitHub.

          </div>

        `;

      });

  </script>

</body>

</html>
