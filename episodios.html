<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Todos los episodios | Hasta el Rabo Todo es Toro
  </title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f2ee;
      color: #222;
      font-family: Arial, Helvetica, sans-serif;
    }

    .page {
      width: 92%;
      max-width: 1000px;
      margin: 0 auto;
      padding: 30px 0 60px;
    }

    .back {
      display: inline-block;
      margin-bottom: 25px;
      color: #5b2a86;
      font-weight: bold;
      text-decoration: none;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 42px;
      line-height: 1.1;
    }

    .subtitle {
      margin: 0 0 30px;
      color: #666;
    }

    #status {
      padding: 20px;
      background: white;
      border-radius: 12px;
      margin-bottom: 20px;
    }

    #episodes {
      display: grid;
      gap: 14px;
    }

    .episode {
      display: grid;
      grid-template-columns: 120px 1fr;
      gap: 18px;
      background: white;
      padding: 14px;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .episode-image {
      width: 120px;
      height: 120px;
      border-radius: 8px;
      overflow: hidden;
      background: #ddd;
    }

    .episode-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .episode-info {
      min-width: 0;
    }

    .episode-number {
      color: #5b2a86;
      font-size: 12px;
      font-weight: bold;
      margin-bottom: 5px;
      text-transform: uppercase;
    }

    .episode-title {
      margin: 0 0 6px;
      font-size: 18px;
      line-height: 1.3;
    }

    .episode-date {
      color: #777;
      font-size: 13px;
      margin-bottom: 10px;
    }

    audio {
      display: block;
      width: 100%;
      max-width: 600px;
      height: 42px;
    }

    .error {
      background: #fff;
      border: 2px solid #c00;
      color: #900;
      padding: 20px;
      border-radius: 12px;
      line-height: 1.5;
    }

    @media (max-width: 600px) {

      .page {
        width: 94%;
        padding-top: 20px;
      }

      h1 {
        font-size: 32px;
      }

      .episode {
        grid-template-columns: 85px 1fr;
        gap: 12px;
        padding: 10px;
      }

      .episode-image {
        width: 85px;
        height: 85px;
      }

      .episode-title {
        font-size: 15px;
      }

      audio {
        height: 40px;
      }

    }

  </style>

</head>


<body>

  <main class="page">

    <a
      class="back"
      href="./index.html"
    >
      ← Volver a la portada
    </a>


    <h1>
      Todos los episodios
    </h1>


    <p class="subtitle">
      Hasta el Rabo Todo es Toro
    </p>


    <div id="status">
      Cargando episodios…
    </div>


    <div id="episodes"></div>

  </main>


  <script>

    (function () {

      var status =
        document.getElementById("status");

      var episodesContainer =
        document.getElementById("episodes");


      function escapeHtml(value) {

        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#039;");

      }


      function formatDate(value) {

        if (!value) {
          return "";
        }

        var date =
          new Date(value);

        if (isNaN(date.getTime())) {
          return "";
        }

        return new Intl.DateTimeFormat(
          "es-ES",
          {
            day: "numeric",
            month: "long",
            year: "numeric"
          }
        ).format(date);

      }


      function loadEpisodes() {

        var request =
          new XMLHttpRequest();


        request.open(
          "GET",
          "./episodes.json?v=" +
          new Date().getTime(),
          true
        );


        request.onreadystatechange =
          function () {

            if (
              request.readyState !== 4
            ) {
              return;
            }


            if (
              request.status < 200 ||
              request.status >= 300
            ) {

              status.innerHTML =
                '<div class="error">' +
                '<strong>Error al cargar episodes.json</strong><br>' +
                'Código HTTP: ' +
                escapeHtml(request.status) +
                '</div>';

              return;
            }


            try {

              var data =
                JSON.parse(
                  request.responseText
                );


              var episodes =
                Array.isArray(data.episodes)
                  ? data.episodes
                  : [];


              if (!episodes.length) {

                status.innerHTML =
                  '<div class="error">' +
                  'El archivo episodes.json no contiene episodios.' +
                  '</div>';

                return;
              }


              status.innerHTML =
                '<strong>' +
                episodes.length +
                '</strong> episodios encontrados.';


              var html = "";


              episodes.forEach(
                function (episode, index) {

                  var originalTitle =
                    String(
                      episode.title ||
                      "Episodio"
                    );


                  var shortTitle =
                    originalTitle.slice(
                      0,
                      50
                    );


                  if (
                    originalTitle.length > 50
                  ) {
                    shortTitle += "…";
                  }


                  var image = "";


                  if (episode.image) {

                    image =
                      '<img src="' +
                      escapeHtml(
                        episode.image
                      ) +
                      '" alt="" loading="lazy">';

                  }


                  var player = "";


                  if (episode.audio) {

                    player =
                      '<audio controls preload="metadata">' +
                      '<source src="' +
                      escapeHtml(
                        episode.audio
                      ) +
                      '" type="audio/mpeg">' +
                      'Tu navegador no puede reproducir este audio.' +
                      '</audio>';

                  }


                  html +=

                    '<article class="episode">' +

                      '<div class="episode-image">' +
                        image +
                      '</div>' +

                      '<div class="episode-info">' +

                        '<div class="episode-number">' +
                          'Episodio ' +
                          (index + 1) +
                        '</div>' +

                        '<h2 class="episode-title">' +
                          escapeHtml(
                            shortTitle
                          ) +
                        '</h2>' +

                        '<div class="episode-date">' +
                          escapeHtml(
                            formatDate(
                              episode.date
                            )
                          ) +
                        '</div>' +

                        player +

                      '</div>' +

                    '</article>';

                }
              );


              episodesContainer.innerHTML =
                html;


            } catch (error) {
