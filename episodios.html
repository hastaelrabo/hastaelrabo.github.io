<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Todos los episodios | Hasta el Rabo Todo es Toro</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f7f4f0;
      color: #222;
    }

    .wrap {
      width: min(1000px, 92%);
      margin: 0 auto;
    }

    header {
      padding: 30px 0 20px;
    }

    .back {
      display: inline-block;
      margin-bottom: 20px;
      color: #5b2a86;
      font-weight: bold;
      text-decoration: none;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.5rem);
    }

    .intro {
      margin: 10px 0 30px;
      color: #666;
    }

    #episodes {
      display: grid;
      gap: 14px;
      padding-bottom: 50px;
    }

    .episode {
      display: grid;
      grid-template-columns: 110px 1fr;
      gap: 16px;
      padding: 14px;
      background: white;
      border-radius: 12px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    .cover {
      width: 110px;
      height: 110px;
      border-radius: 8px;
      overflow: hidden;
      background: #ddd;
    }

    .cover img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .info {
      min-width: 0;
    }

    .label {
      font-size: .75rem;
      font-weight: bold;
      color: #5b2a86;
      text-transform: uppercase;
      margin-bottom: 5px;
    }

    h2 {
      margin: 0 0 6px;
      font-size: 1.05rem;
      line-height: 1.3;
    }

    .date {
      color: #777;
      font-size: .85rem;
      margin-bottom: 10px;
    }

    audio {
      width: 100%;
      height: 40px;
    }

    .error {
      padding: 20px;
      background: white;
      border-radius: 12px;
      color: #a00;
    }

    @media (max-width: 600px) {
      .episode {
        grid-template-columns: 80px 1fr;
        gap: 12px;
      }

      .cover {
        width: 80px;
        height: 80px;
      }

      h2 {
        font-size: .95rem;
      }

      audio {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <div class="wrap">

      <a class="back" href="./index.html">
        ← Volver a la portada
      </a>

      <h1>Todos los episodios</h1>

      <p class="intro">
        Todos los episodios de Hasta el Rabo Todo es Toro.
      </p>

    </div>
  </header>

  <main class="wrap">

    <div id="episodes">
      <p>Cargando episodios…</p>
    </div>

  </main>


  <script>

    const container = document.getElementById("episodes");


    function escapeHtml(value) {

      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

    }


    function formatDate(value) {

      if (!value) return "";

      const date = new Date(value);

      if (isNaN(date.getTime())) {
        return "";
      }

      return new Intl.DateTimeFormat(
        "es-ES",
        {
          day: "numeric",
          month: "long",
          year: "numeric"
        }
      ).format(date);

    }


    fetch("./episodes.json?v=" + Date.now())

      .then(function(response) {

        if (!response.ok) {
          throw new Error(
            "No se pudo cargar episodes.json"
          );
        }

        return response.json();

      })

      .then(function(data) {

        const episodes =
          Array.isArray(data.episodes)
            ? data.episodes
            : [];


        if (!episodes.length) {

          container.innerHTML =
            '<div class="error">No hay episodios disponibles.</div>';

          return;

        }


        container.innerHTML =
          episodes.map(function(ep) {

            const title =
              String(ep.title || "Episodio")
                .slice(0, 50);


            const image =
              ep.image
                ? '<img src="' +
                  escapeHtml(ep.image) +
                  '" alt="" loading="lazy">'
                : "";


            return (

              '<article class="episode">' +

                '<div class="cover">' +
                  image +
                '</div>' +

                '<div class="info">' +

                  '<div class="label">' +
                    'EPISODIO' +
                  '</div>' +

                  '<h2>' +
                    escapeHtml(title) +
                    (String(ep.title || "").length > 50
                      ? "…"
                      : "") +
                  '</h2>' +

                  '<div class="date">' +
                    escapeHtml(formatDate(ep.date)) +
                  '</div>' +

                  (
                    ep.audio
                      ? '<audio controls preload="metadata" src="' +
                        escapeHtml(ep.audio) +
                        '"></audio>'
                      : ""
                  ) +

                '</div>' +

              '</article>'

            );

          }).join("");

      })

      .catch(function(error) {

        console.error(error);

        container.innerHTML =
          '<div class="error">' +
          '<strong>No se han podido cargar los episodios.</strong><br><br>' +
          'Error: ' +
          escapeHtml(error.message) +
          '</div>';

      });

  </script>

</body>
</html>
