    /*
     * IMÁGENES DE LOS EPISODIOS

    .episodes-grid .episode-cover {

      font-weight: 900;

      letter-spacing: .06em;

      border: 3px solid #432064;

      box-shadow:
        0 8px 0 #432064,
        0 16px 30px rgba(91, 42, 134, .28);

      transition:
        transform .15s ease,
        box-shadow .15s ease;
    }


    .episodes-archive-large a:hover {
      transform: translateY(-3px);

      box-shadow:
        0 11px 0 #432064,
        0 20px 35px rgba(91, 42, 134, .32);
    }


    .episodes-archive-large a:active {
      transform: translateY(3px);

      }


      .episodes-archive-large a {
        width: 100%;
        max-width: none;

        padding: 20px 18px;

        font-size: 16px;
      }

    }
